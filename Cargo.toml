[package]
name = "AlternativeLink"
version = "0.1.2"
authors = ["ERR0RW0LF"]
license-file = "LICENSE"
description = "Rust implementation for SharkLink"
edition = "2024"
publish = false
repository = "https://github.com/ERR0RW0LF/AlternativeLink"

[[bin]]
name = "alternative-link"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"

[dependencies]
#socket = "0.0.7"
tokio = { version = "1.53.1", features = ["full"] }
if-addrs = "0.15.0"
tokio-util = "0.7.19"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
clap = { version = "4.6.6", features = ["derive"]}

