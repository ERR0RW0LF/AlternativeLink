[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.3"
authors = ["ERR0RW0LF"]
license-file = "LICENSE"
description = "Rust implementation for SharkLink"
edition = "2024"
publish = false
repository = "https://github.com/ERR0RW0LF/AlternativeLink"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
if-addrs = "0.15.0"
tokio-util = "0.7.19"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
clap = { version = "4.6.6", features = ["derive"]}
alternative-link-core = { path = "crates/alternative-link-core" }